<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>:root{--bg:#fff;--bg-tint:#FAF9FF;--ink:#15121F;--ink-soft:#605C73;--ink-faint:#908DA3;--purple:#7B5CFA;--line:#E9E7F5;--card:#FBFAFF}
@media(prefers-color-scheme:dark){:root{--bg:#0f0d17;--bg-tint:#161326;--ink:#F2F0FA;--ink-soft:#B9B5CC;--ink-faint:#8C88A3;--line:#2A2640;--card:#161326}
.dchart .bar,.dchart .s0{fill:#9A82FF;stroke:#9A82FF}.dchart .s1{stroke:#2BC4B0;fill:#2BC4B0}.dchart .s2{stroke:#F59A4A;fill:#F59A4A}.dchart .s3{stroke:#6FA0F5;fill:#6FA0F5}.dchart .s4{stroke:#F06595;fill:#F06595}}
body{margin:0;padding:8px;background:var(--bg);font-family:Inter,system-ui,sans-serif}.dchart{margin:0}
.credit{font:12px Inter,sans-serif;color:var(--ink-faint);margin:6px 4px 0}.credit a{color:var(--purple)}

.dchart{margin:24px 0 28px;padding:18px 16px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.dchart{overflow-x:auto}.dchart svg{width:100%;height:auto;display:block;min-width:460px}
.dchart figcaption{font-size:13px;color:var(--ink-faint);margin-top:10px;line-height:1.5}
.dchart .ct{font:600 15px 'Space Grotesk',sans-serif;fill:var(--ink)}
.dchart .lbl{font:13px 'Inter',sans-serif;fill:var(--ink-soft)}
.dchart .val{font:600 13px 'Inter',sans-serif;fill:var(--ink)}
.dchart .ax{font:12px 'Inter',sans-serif;fill:var(--ink-faint)}
.dchart .grid{stroke:var(--line);stroke-width:1}
.dchart .bar{fill:var(--purple)}
.dchart .bar2{fill:#0E9F8E}
.dchart .s0{stroke:#7B5CFA;fill:#7B5CFA}.dchart .s1{stroke:#0E9F8E;fill:#0E9F8E}.dchart .s2{stroke:#E0791B;fill:#E0791B}.dchart .s3{stroke:#2F6FDB;fill:#2F6FDB}.dchart .s4{stroke:#D6336C;fill:#D6336C}
html[data-theme="dark"] .dchart .bar,html[data-theme="dark"] .dchart .s0{fill:#9A82FF;stroke:#9A82FF}
html[data-theme="dark"] .dchart .s1{stroke:#2BC4B0;fill:#2BC4B0}html[data-theme="dark"] .dchart .s2{stroke:#F59A4A;fill:#F59A4A}html[data-theme="dark"] .dchart .s3{stroke:#6FA0F5;fill:#6FA0F5}html[data-theme="dark"] .dchart .s4{stroke:#F06595;fill:#F06595}
.dchart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.dchart .pt{stroke:none}
.dtable-wrap{overflow-x:auto;margin:18px 0 26px;-webkit-overflow-scrolling:touch}
.dtable{border-collapse:collapse;width:100%;font-size:14px;min-width:480px}
.dtable caption{caption-side:top;text-align:left;font:600 14px 'Space Grotesk',sans-serif;color:var(--ink);padding:0 0 8px}
.dtable th,.dtable td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:right;color:var(--ink-soft);vertical-align:top}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable th{color:var(--ink);font-weight:600;background:var(--bg-tint)}
.dtable td:first-child{color:var(--ink);font-weight:500}
.dtable tr.tot td{font-weight:700;color:var(--ink)}
.usebox{border:1px solid var(--line);border-radius:14px;padding:18px 18px 6px;margin:26px 0;background:var(--card)}
.usebox h2{margin:0 0 10px !important}
.usebox textarea{width:100%;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink);resize:vertical;min-height:84px;margin-bottom:14px}
.usebox .dl{display:inline-block;padding:9px 16px;border-radius:999px;background:var(--purple);color:#fff !important;text-decoration:none !important;font:600 14px 'Inter',sans-serif;margin:0 0 16px}
.usebox .small{font-size:13px;color:var(--ink-faint)}
.fine{font-size:13px !important;color:var(--ink-faint) !important}
